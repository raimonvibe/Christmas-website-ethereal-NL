name: Dependency updates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-updates.yml
      - .github/dependabot.yml
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/dependency-updates.yml
      - .github/dependabot.yml
      - package.json
      - package-lock.json
  schedule:
    # Every Monday 06:00 UTC (08:00 in the Netherlands in summer).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check outdated packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report outdated dependencies
        run: |
          set -euo pipefail

          {
            echo "# Dependency updates"
            echo ""
            echo "Checked $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo ""
            echo "This job reports drift only. Dependabot opens update PRs every Monday."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::group::npm outdated"
          npm_json="$(npm outdated --json || true)"
          echo "${npm_json:-{}}"
          echo "::endgroup::"

          if [ -z "$npm_json" ] || [ "$npm_json" = "{}" ]; then
            {
              echo "## npm"
              echo ""
              echo "All packages are up to date."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::There are outdated npm packages. See the job summary."
            {
              echo "## npm"
              echo ""
              echo "Outdated packages:"
              echo ""
              echo '```json'
              echo "$npm_json"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "::group::npm audit"
          npm audit --json > /tmp/npm-audit.json || true
          cat /tmp/npm-audit.json
          echo "::endgroup::"

          vuln_summary="$(node -e 'const a=JSON.parse(require("fs").readFileSync("/tmp/npm-audit.json","utf8")); const m=(a.metadata&&a.metadata.vulnerabilities)||{}; const total=Object.values(m).reduce((n,v)=>n+Number(v||0),0); process.stdout.write(JSON.stringify({total, ...m}))')"
          vuln_count="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).total))' "$vuln_summary")"

          if [ "$vuln_count" = "0" ]; then
            {
              echo "## npm audit"
              echo ""
              echo "No known vulnerabilities."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::npm audit reported ${vuln_count} vulnerabilities. See the job summary."
            {
              echo "## npm audit"
              echo ""
              echo "Vulnerabilities found: ${vuln_count}"
              echo ""
              echo '```json'
              echo "$vuln_summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
